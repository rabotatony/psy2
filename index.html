<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSY2 · מהפך</title>
<style>
:root{--bg:#05080c;--lime:#d4ff3f;--cyan:#5ff;--purple:#b46bff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#eef;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh}
h1{color:var(--lime);text-shadow:0 0 18px var(--lime);letter-spacing:3px;font-size:42px;margin:8px}
#viz{width:min(420px,90vw);height:220px;border-radius:16px;background:#070a10}
#play{font-size:20px;padding:14px 44px;border-radius:14px;border:2px solid var(--lime);background:#131a10;color:var(--lime);cursor:pointer;margin:10px;box-shadow:0 0 14px rgba(212,255,63,.4)}
.row{display:flex;gap:14px;align-items:center;margin:8px;flex-wrap:wrap;justify-content:center}
#bpmVal{font-size:26px;font-weight:700}
#styles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
.stylecard{padding:8px 12px;border-radius:12px;border:1px solid #2a3a4a;background:#0d1420;color:#cde;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.stylecard.on{border-color:var(--lime);box-shadow:0 0 12px rgba(212,255,63,.5);color:var(--lime)}
.stylecard canvas{opacity:.8}
#macros{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.macro{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#9ab;gap:4px}
.macro input{width:120px}
.macro em{color:var(--cyan);font-style:normal}
#dj,#measure{padding:10px 26px;border-radius:999px;border:2px solid var(--purple);background:#17102a;color:var(--purple);cursor:pointer;font-weight:700}
#dj.on{background:var(--purple);color:#120826;box-shadow:0 0 14px var(--purple)}
#lufs{font-size:12px;color:#9ab;border:1px solid #2a3a4a;border-radius:8px;padding:6px 10px}
#errbox{position:fixed;bottom:0;left:0;right:0;background:#401016;color:#ffb4bc;padding:8px;font-size:12px;display:none;z-index:99}
</style>
</head>
<body>
<div class="row"><button id="play">PLAY ▶</button><span id="bpmVal">142</span><input type="range" id="bpmSlider" min="60" max="200" value="142"><span>BPM</span></div>
<h1>PSY2</h1>
<canvas id="viz" width="420" height="220"></canvas>
<div id="styles"></div>
<div id="macros"></div>
<div class="row"><button id="dj">DJ 🎧</button><button id="measure">MEASURE 📊</button><span id="lufs">-9 LUFS</span></div>
<div id="errbox"></div>
<script type="module" src="js/app.js?v=3"></script>
</body>
</html>
