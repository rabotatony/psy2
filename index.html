<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSY2 · מנוע פסיי-טראנס</title>
<style>
body{margin:0;background:#07090f;color:#eef;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#d4ff3f;letter-spacing:2px}
#play{font-size:22px;padding:16px 40px;border-radius:14px;border:2px solid #d4ff3f;background:#131a10;color:#d4ff3f;cursor:pointer;margin:14px}
#styles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px}
.stylebtn{padding:10px 14px;border-radius:10px;border:1px solid #345;background:#101623;color:#cde;cursor:pointer}
.stylebtn.on{border-color:#d4ff3f;color:#d4ff3f;background:#1a2410}
.row{display:flex;gap:12px;align-items:center;margin:10px}
input[type=range]{width:220px}
</style>
</head>
<body>
<h1>PSY2</h1>
<button id="play">▶ PLAY</button>
<div class="row"><span>BPM</span><input type="range" id="bpmSlider" min="60" max="200" value="142"><span id="bpmVal">142</span></div>
<div class="row" style="gap:16px;flex-wrap:wrap;justify-content:center"><label style="font-size:11px;color:#9ab">DRIVE<br><input type="range" id="m_DRIVE" min="0" max="100" value="30" style="width:110px"></label><label style="font-size:11px;color:#9ab">CUTOFF<br><input type="range" id="m_CUTOFF" min="0" max="100" value="80" style="width:110px"></label><label style="font-size:11px;color:#9ab">SPACE<br><input type="range" id="m_SPACE" min="0" max="100" value="40" style="width:110px"></label><label style="font-size:11px;color:#9ab">PUMP<br><input type="range" id="m_PUMP" min="0" max="100" value="50" style="width:110px"></label></div>
<div class="row" style="gap:16px;flex-wrap:wrap;justify-content:center"><label style="font-size:11px;color:#9ab">DRIVE<br><input type="range" id="m_DRIVE" min="0" max="100" value="30" style="width:110px"></label><label style="font-size:11px;color:#9ab">CUTOFF<br><input type="range" id="m_CUTOFF" min="0" max="100" value="80" style="width:110px"></label><label style="font-size:11px;color:#9ab">SPACE<br><input type="range" id="m_SPACE" min="0" max="100" value="40" style="width:110px"></label><label style="font-size:11px;color:#9ab">PUMP<br><input type="range" id="m_PUMP" min="0" max="100" value="50" style="width:110px"></label></div>
<div id="styles"></div>
<div class="row"><button id="djBtn" style="padding:10px 20px;border-radius:10px;border:1px solid #345;background:#101623;color:#cde;cursor:pointer">🎧 DJ</button><button id="measure" style="padding:10px 20px;border-radius:10px;border:1px solid #345;background:#101623;color:#cde;cursor:pointer">📊 MEASURE</button><span id="mout" style="font-size:12px;color:#9ab"></span></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
